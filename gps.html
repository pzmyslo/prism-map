<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Moja Pozycja GPS</title>

<!-- =====================================================
     LEAFLET
     ===================================================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* =====================================================
   PEŁNY EKRAN
   ===================================================== */
html, body, #map {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

/* =====================================================
   MAPA
   ===================================================== */
#map {
    position: absolute;
    left: 0;
    top: 0;
}

/* =====================================================
   USUWAMY ZOOM
   ===================================================== */
.leaflet-control-zoom {
    display: none !important;
}

/* =====================================================
   ATRYBUCJA OPENSTREETMAP
   ===================================================== */
.leaflet-control-attribution {
    font-size: 7px !important;
    line-height: 9px !important;
    padding: 1px 3px !important;
    background: rgba(255,255,255,0.60) !important;
}

/* =====================================================
   ZNACZNIK GPS (Koło czerwone + czerwona strzałka)
   ===================================================== */
.gps-wrapper {
    width: 34px;
    height: 34px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Płynna animacja obrotu znacznika */
    transition: transform 0.3s ease-out;
}

/* Czerwone koło z białym tłem */
.gps-circle {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-sizing: border-box;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid #ff0000; /* Czerwona ramka */
    box-shadow: 0 2px 6px rgba(0,0,0,0.6); /* Cień pod kołem */
    z-index: 1;
}

/* Czerwona strzałka wewnątrz */
.gps-arrow-shape {
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 16px solid #ff0000;
    z-index: 2;
    margin-bottom: 4px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
}

/* =====================================================
   STATUS (Pojawia się przy braku zgody/błędzie)
   ===================================================== */
#status {
    position: absolute;
    left: 5px;
    top: 5px;
    z-index: 10000;
    padding: 6px 10px;
    border-radius: 5px;
    background: rgba(0,0,0,0.85);
    color: white;
    font: 12px Arial, sans-serif;
    display: block;
}
</style>

</head>
<body>

<div id="map"></div>
<div id="status">Oczekiwanie na uprawnienia GPS...</div>

<script>
/* =====================================================
   MAPA LEAFLET
   ===================================================== */
const map = L.map("map", {
    zoomControl: false,
    attributionControl: true,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    touchZoom: false,
    boxZoom: false,
    keyboard: false
}).setView([0, 0], 18); // Domyślny poziom powiększenia

/* =====================================================
   WARSTWA MAPY OPENSTREETMAP
   ===================================================== */
L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

/* =====================================================
   KOMPLETNA IKONA ZNACZNIKA
   ===================================================== */
const gpsIcon = L.divIcon({
    className: "",
    html: '<div id="directionMarker" class="gps-wrapper">' +
          '<div class="gps-circle"></div>' +
          '<div class="gps-arrow-shape"></div>' +
          '</div>',
    iconSize: [34, 34],
    iconAnchor: [17, 17] /* Środek znacznika dokłanie w centrum mapy */
});

/* =====================================================
   ZMIENNE
   ===================================================== */
let gpsMarker = null;

/* =====================================================
   STATUS
   ===================================================== */
function showStatus(text) {
    const element = document.getElementById("status");
    element.textContent = text;
    element.style.display = text ? "block" : "none";
}

/* =====================================================
   OBSŁUGA POBIERANIA POZYCJI GPS Z URZĄDZENIA
   ===================================================== */
function onPositionSuccess(position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    const heading = position.coords.heading; // Kierunek w stopniach (o ile dostępny)

    const userLatLng = [latitude, longitude];

    // 1. Zawsze ustawiaj środek mapy dokładnie na pobraną pozycję
    map.setView(userLatLng, 18, { animate: false });

    // 2. Dodaj lub przesuń znacznik (zawsze w centrum)
    if (!gpsMarker) {
        gpsMarker = L.marker(userLatLng, {
            icon: gpsIcon,
            interactive: false
        }).addTo(map);
    } else {
        gpsMarker.setLatLng(userLatLng);
    }

    // 3. Obróć strzałkę, jeśli urządzenie udostępnia kierunek ruchu (heading)
    if (heading !== null && !isNaN(heading)) {
        const markerDiv = document.getElementById("directionMarker");
        if (markerDiv) {
            markerDiv.style.transform = "rotate(" + heading + "deg)";
        }
    }

    // Ukryj status po pomyślnym pobraniu pozycji
    showStatus("");
}

function onPositionError(error) {
    switch(error.code) {
        case error.PERMISSION_DENIED:
            showStatus("Brak zgody na dostęp do GPS.");
            break;
        case error.POSITION_UNAVAILABLE:
            showStatus("Sygnał GPS jest niedostępny.");
            break;
        case error.TIMEOUT:
            showStatus("Przekroczono czas oczekiwania na lokalizację.");
            break;
        default:
            showStatus("Wystąpił nieznany błąd GPS.");
            break;
    }
}

/* =====================================================
   START ŚLEDZENIA
   ===================================================== */
function startTracking() {
    if ("geolocation" in navigator) {
        // watchPosition automatycznie aktualizuje pozycję w czasie rzeczywistym
        navigator.geolocation.watchPosition(onPositionSuccess, onPositionError, {
            enableHighAccuracy: true, // Zapewnia najwyższą dokładność (GPS)
            maximumAge: 0,            // Brak pamięci podręcznej (zawsze świeże dane)
            timeout: 10000            // Czas oczekiwania na odpowiedź
        });
    } else {
        showStatus("Twoja przeglądarka nie obsługuje geolokalizacji.");
    }
}

// Uruchomienie śledzenia
startTracking();

</script>
</body>
</html>
