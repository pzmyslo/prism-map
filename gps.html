<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozycja GPS</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e5e5;
        }
        #status-info {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 14px;
            border-radius: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 13px;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            pointer-events: none;
        }
        .error {
            color: #d9534f !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status-info">Inicjalizacja połączenia...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const REFRESH_INTERVAL = 10000; // 10 sekund
        const TRACCAR_HOST = "https://demo.traccar.org";

        // Pobranie tokena z adresu URL
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('token');

        // Inicjalizacja mapy Leaflet
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([52.237049, 21.017532], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        let positionMarker = null;
        let accuracyCircle = null;
        let initialZoomDone = false;

        async function updatePosition() {
            const statusEl = document.getElementById('status-info');

            if (!TOKEN) {
                statusEl.classList.add('error');
                statusEl.innerText = "Brak tokena w adresie URL (?token=...)";
                return;
            }

            try {
                // Zapytanie przez uniwersalne proxy
                const targetUrl = `${TRACCAR_HOST}/api/positions?token=${encodeURIComponent(TOKEN)}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);

                if (response.status === 401 || response.status === 403) {
                    throw new Error("TOKEN_EXPIRED");
                }

                if (!response.ok) {
                    throw new Error(`HTTP_${response.status}`);
                }

                const positions = await response.json();

                if (positions && positions.length > 0) {
                    const latest = positions[positions.length - 1];
                    const lat = latest.latitude;
                    const lng = latest.longitude;
                    const accuracy = latest.accuracy || 0;
                    const latlng = [lat, lng];

                    if (!positionMarker) {
                        positionMarker = L.circleMarker(latlng, {
                            color: '#ffffff',
                            fillColor: '#0078ff',
                            fillOpacity: 1,
                            weight: 3,
                            radius: 10
                        }).addTo(map);

                        if (accuracy > 0) {
                            accuracyCircle = L.circle(latlng, {
                                radius: accuracy,
                                color: '#0078ff',
                                fillColor: '#0078ff',
                                fillOpacity: 0.15,
                                weight: 1
                            }).addTo(map);
                        }
                    } else {
                        positionMarker.setLatLng(latlng);
                        if (accuracyCircle) {
                            accuracyCircle.setLatLng(latlng);
                            if (accuracy > 0) accuracyCircle.setRadius(accuracy);
                        }
                    }

                    if (!initialZoomDone) {
                        map.setView(latlng, 15);
                        initialZoomDone = true;
                    }

                    statusEl.classList.remove('error');
                    const timeStr = new Date(latest.fixTime || latest.deviceTime).toLocaleTimeString('pl-PL');
                    statusEl.innerText = `Ostatnia pozycja: ${timeStr}`;
                } else {
                    statusEl.innerText = "Brak pozycji dla tego tokena";
                }

            } catch (error) {
                console.error("Błąd:", error);
                statusEl.classList.add('error');
                if (error.message === "TOKEN_EXPIRED") {
                    statusEl.innerText = "Token wygasł – wygeneruj nowy w Traccar";
                } else {
                    statusEl.innerText = "Błąd pobierania danych";
                }
            }
        }

        updatePosition();
        setInterval(updatePosition, REFRESH_INTERVAL);
    </script>
</body>
</html>
