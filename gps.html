<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Traccar GPS Map</title>

<!-- =====================================================
     LEAFLET
     ===================================================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* =====================================================
   PEŁNY EKRAN
   ===================================================== */
html, body, #map {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

/* =====================================================
   MAPA
   ===================================================== */
#map {
    position: absolute;
    left: 0;
    top: 0;
}

/* =====================================================
   USUWAMY ZOOM
   ===================================================== */
.leaflet-control-zoom {
    display: none !important;
}

/* =====================================================
   ATRYBUCJA OPENSTREETMAP
   ===================================================== */
.leaflet-control-attribution {
    font-size: 7px !important;
    line-height: 9px !important;
    padding: 1px 3px !important;
    background: rgba(255,255,255,0.60) !important;
}

/* =====================================================
   ZNACZNIK GPS (Koło czerwone + czerwona strzałka)
   ===================================================== */
.gps-wrapper {
    width: 34px;
    height: 34px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease-out;
}

.gps-circle {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-sizing: border-box;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid #ff0000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    z-index: 1;
}

.gps-arrow-shape {
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 16px solid #ff0000;
    z-index: 2;
    margin-bottom: 4px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
}

/* =====================================================
   STATUS BŁĘDU / ŁADOWANIA
   ===================================================== */
#status {
    position: absolute;
    left: 5px;
    top: 5px;
    z-index: 10000;
    padding: 4px 7px;
    border-radius: 5px;
    background: rgba(0,0,0,0.78);
    color: white;
    font: 10px Arial, sans-serif;
    display: block;
}
</style>

</head>
<body>

<div id="map"></div>
<div id="status">Łączenie z Traccar...</div>

<script>
/* =====================================================
   POBIERANIE TOKENA Z ADRESU URL
   ===================================================== */
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get("token");

/* Serwer Traccar */
const SERVER = "https://demo.traccar.org";
const REFRESH_TIME = 2000;
const DEFAULT_ZOOM = 18;

/* =====================================================
   MAPA LEAFLET
   ===================================================== */
const map = L.map("map", {
    zoomControl: false,
    attributionControl: true,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    touchZoom: false,
    boxZoom: false,
    keyboard: false
}).setView([0, 0], DEFAULT_ZOOM);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

/* =====================================================
   IKONA ZNACZNIKA
   ===================================================== */
const gpsIcon = L.divIcon({
    className: "",
    html: '<div id="directionMarker" class="gps-wrapper">' +
          '<div class="gps-circle"></div>' +
          '<div class="gps-arrow-shape"></div>' +
          '</div>',
    iconSize: [34, 34],
    iconAnchor: [17, 17]
});

let gpsMarker = null;

function showStatus(text) {
    const element = document.getElementById("status");
    element.textContent = text;
    element.style.display = text ? "block" : "none";
}

/* =====================================================
   POBIERANIE POZYCJI GPS Z TRACCAR
   ===================================================== */
async function updateGPS() {
    try {
        // Zapytanie z autoryzacją Bearer TOKEN bez konieczności tworzenia sesji
        const response = await fetch(`${SERVER}/api/positions`, {
            method: "GET",
            cache: "no-store",
            headers: {
                "Accept": "application/json",
                "Authorization": "Bearer " + TOKEN
            }
        });

        if (!response.ok) {
            if (response.status === 401) {
                showStatus("BŁĄD AUTORYZACJI (TOKEN WYGASAŁ LUB JEST NIEPRAWIDŁOWY)");
            } else {
                showStatus("BŁĄD HTTP " + response.status);
            }
            return;
        }

        const positions = await response.json();

        if (!Array.isArray(positions) || positions.length === 0) {
            showStatus("BRAK DOSTĘPNYCH POZYCJI GPS");
            return;
        }

        const data = positions[0];
        const latitude = Number(data.latitude);
        const longitude = Number(data.longitude);

        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
            showStatus("BŁĘDNE WSPÓŁRZĘDNE");
            return;
        }

        const position = [latitude, longitude];

        // Wyśrodkowanie mapy ściśle na pozycji
        map.setView(position, DEFAULT_ZOOM, { animate: false });

        // Aktualizacja lub utwożenie znacznika
        if (!gpsMarker) {
            gpsMarker = L.marker(position, {
                icon: gpsIcon,
                interactive: false
            }).addTo(map);
        } else {
            gpsMarker.setLatLng(position);
        }

        // Obrót strzałki wg kursu (course)
        const course = Number(data.course);
        if (Number.isFinite(course)) {
            const markerDiv = document.getElementById("directionMarker");
            if (markerDiv) {
                markerDiv.style.transform = "rotate(" + course + "deg)";
            }
        }

        showStatus(""); // Ukryj status po sukcesie

    } catch (error) {
        showStatus("BŁĄD CORS / POŁĄCZENIA Z SERWEREM");
    }
}

/* =====================================================
   START
   ===================================================== */
function start() {
    if (!TOKEN) {
        showStatus("BRAK TOKENU W ADRESIE URL");
        return;
    }

    updateGPS();
    setInterval(updateGPS, REFRESH_TIME);
}

start();
</script>
</body>
</html>
