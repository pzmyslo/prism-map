<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPS</title>


    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        html,
        body,
        #map {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;
            background: #ddd;

        }


        #map {

            position: fixed;
            inset: 0;

        }


        /* =========================================
           MAŁY PUNKT GPS
           ========================================= */

        .gps-marker {

            width: 14px;
            height: 14px;

            background: #1976d2;

            border: 2px solid white;

            border-radius: 50%;

            box-shadow:
                0 1px 5px
                rgba(0, 0, 0, 0.5);

        }


        /* =========================================
           KOMUNIKAT BŁĘDU
           ========================================= */

        #error {

            display: none;

            position: fixed;

            z-index: 9999;

            left: 50%;
            top: 20px;

            transform:
                translateX(-50%);

            width: min(90%, 500px);

            padding: 12px 16px;

            background:
                rgba(180, 0, 0, 0.95);

            color: white;

            border-radius: 8px;

            font-family:
                Arial, sans-serif;

            font-size: 14px;

            text-align: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.3);

        }


        /* =========================================
           MINIMALNA ATRYBUCJA MAPY
           ========================================= */

        .leaflet-control-attribution {

            font-size: 0 !important;

            padding: 0 2px !important;

            line-height: 3px !important;

            opacity: 0.65;

        }


        .leaflet-control-attribution::after {

            content:
                "© OpenStreetMap contributors";

            font-size: 2px;

            line-height: 3px;

        }


        .leaflet-control-attribution a {

            font-size: 2px !important;

        }

    </style>

</head>


<body>


<div id="map"></div>

<div id="error"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


    /*
     * ==========================================================
     * CLOUDFLARE WORKER
     * ==========================================================
     */

    const WORKER_URL =
        "https://prism-gps.piozmy1.workers.dev";


    /*
     * ==========================================================
     * ODŚWIEŻANIE
     * ==========================================================
     */

    const UPDATE_INTERVAL = 10000;


    /*
     * ==========================================================
     * TOKEN
     * ==========================================================
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const token =
        params.get("token");


    /*
     * ==========================================================
     * MAPA
     * ==========================================================
     */

    const map =
        L.map(
            "map",
            {
                zoomControl: false
            }
        );


    /*
     * ==========================================================
     * OPENSTREETMAP
     * ==========================================================
     */

    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom: 19,

            attribution:
                '&copy; OpenStreetMap contributors'

        }

    ).addTo(map);


    /*
     * Początkowy widok
     */

    map.setView(

        [52.069, 19.480],

        6

    );


    /*
     * ==========================================================
     * IKONA GPS
     * ==========================================================
     */

    const gpsIcon =
        L.divIcon({

            className: "",

            html:
                '<div class="gps-marker"></div>',

            iconSize:
                [18, 18],

            iconAnchor:
                [9, 9]

        });


    let marker = null;

    let firstPosition = true;


    /*
     * ==========================================================
     * BŁĘDY
     * ==========================================================
     */

    function showError(message) {

        const element =
            document.getElementById(
                "error"
            );

        element.textContent =
            message;

        element.style.display =
            "block";

    }


    function hideError() {

        document.getElementById(
            "error"
        ).style.display =
            "none";

    }


    /*
     * ==========================================================
     * GPS
     * ==========================================================
     */

    async function updateGPS() {

        try {

            if (!token) {

                throw new Error(
                    "Brak tokenu w adresie."
                );

            }


            const response =
                await fetch(

                    WORKER_URL +
                    "?token=" +
                    encodeURIComponent(token),

                    {

                        method: "GET",

                        cache: "no-store"

                    }

                );


            if (!response.ok) {

                throw new Error(

                    "HTTP " +
                    response.status

                );

            }


            const positions =
                await response.json();


            if (

                !Array.isArray(
                    positions
                )

                ||

                positions.length === 0

            ) {

                throw new Error(
                    "Brak dostępnej pozycji GPS."
                );

            }


            const position =
                positions[0];


            const latitude =
                Number(
                    position.latitude
                );


            const longitude =
                Number(
                    position.longitude
                );


            if (

                !Number.isFinite(
                    latitude
                )

                ||

                !Number.isFinite(
                    longitude
                )

            ) {

                throw new Error(
                    "Nieprawidłowe współrzędne GPS."
                );

            }


            const coordinates = [

                latitude,
                longitude

            ];


            /*
             * Marker
             */

            if (!marker) {

                marker =
                    L.marker(

                        coordinates,

                        {
                            icon:
                                gpsIcon
                        }

                    ).addTo(map);

            }

            else {

                marker.setLatLng(
                    coordinates
                );

            }


            /*
             * Pierwsze centrowanie
             */

            if (firstPosition) {

                map.setView(

                    coordinates,

                    17

                );

                firstPosition =
                    false;

            }


            hideError();


            console.log(

                "GPS:",
                latitude,
                longitude,
                position.fixTime

            );

        }


        catch (error) {

            console.error(
                "GPS ERROR:",
                error
            );


            showError(

                "Nie można pobrać lokalizacji: " +
                error.message

            );

        }

    }


    /*
     * Pierwsze pobranie
     */

    updateGPS();


    /*
     * Aktualizacja co 10 sekund
     */

    setInterval(

        updateGPS,

        UPDATE_INTERVAL

    );


</script>


</body>

</html>
