<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozycja GPS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; overflow: hidden; background: #e5e5e5; }
        #status-info {
            position: absolute; top: 12px; right: 12px; z-index: 1000;
            background: rgba(255, 255, 255, 0.92); padding: 8px 14px; border-radius: 20px;
            font-family: sans-serif; font-size: 13px; color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); pointer-events: none;
        }
        .error { color: #d9534f !important; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-info">Łączenie...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('token');

        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([52.237, 21.017], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let positionMarker = null;
        let accuracyCircle = null;
        let initialZoomDone = false;

        async function updatePosition() {
            const statusEl = document.getElementById('status-info');

            if (!TOKEN) {
                statusEl.classList.add('error');
                statusEl.innerText = "Brak tokena w URL (?token=...)";
                return;
            }

            try {
                // Wywołanie API Traccar przez bezpośredni przekaźnik bez wyzwalania preflight CORS
                const targetUrl = `https://demo.traccar.org/api/positions?token=${encodeURIComponent(TOKEN)}`;
                const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const positions = await response.json();

                if (Array.isArray(positions) && positions.length > 0) {
                    const latest = positions[positions.length - 1];
                    const latlng = [latest.latitude, latest.longitude];

                    if (!positionMarker) {
                        positionMarker = L.circleMarker(latlng, {
                            color: '#ffffff', fillColor: '#0078ff', fillOpacity: 1, weight: 3, radius: 10
                        }).addTo(map);

                        if (latest.accuracy > 0) {
                            accuracyCircle = L.circle(latlng, {
                                radius: latest.accuracy, color: '#0078ff', fillColor: '#0078ff', fillOpacity: 0.15, weight: 1
                            }).addTo(map);
                        }
                    } else {
                        positionMarker.setLatLng(latlng);
                        if (accuracyCircle) {
                            accuracyCircle.setLatLng(latlng);
                            if (latest.accuracy > 0) accuracyCircle.setRadius(latest.accuracy);
                        }
                    }

                    if (!initialZoomDone) {
                        map.setView(latlng, 15);
                        initialZoomDone = true;
                    }

                    statusEl.classList.remove('error');
                    const timeStr = new Date(latest.fixTime || latest.deviceTime).toLocaleTimeString('pl-PL');
                    statusEl.innerText = `Ostatnia pozycja: ${timeStr}`;
                } else {
                    statusEl.innerText = "Brak danych pozycji";
                }

            } catch (error) {
                console.error(error);
                statusEl.classList.add('error');
                statusEl.innerText = "Błąd pobierania danych z serwera";
            }
        }

        updatePosition();
        setInterval(updatePosition, 10000);
    </script>
</body>
</html>
