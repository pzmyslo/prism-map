<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozycja GPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #error-msg {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            color: #d9534f;
            font-weight: bold;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="error-msg">Brak tokena w adresie URL (?token=...)</div>
        <iframe id="traccar-frame" src="" allow="geolocation"></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('token');
        const frame = document.getElementById('traccar-frame');
        const errorMsg = document.getElementById('error-msg');

        if (!TOKEN) {
            errorMsg.style.display = 'block';
            frame.style.display = 'none';
        } else {
            frame.src = `https://demo.traccar.org?token=${encodeURIComponent(TOKEN)}`;

            // Automatyczne ukrywanie elementów interfejsu Traccara po wczytaniu
            frame.addEventListener('load', () => {
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow.document;
                    const style = frameDoc.createElement('style');
                    style.innerHTML = `
                        /* Ukrycie paska nawigacji, menu bocznego i nagłówków */
                        .tbar, .v-toolbar, .v-navigation-drawer, .v-footer, 
                        header, nav, .v-card, .v-btn--icon {
                            display: none !important;
                        }
                        /* Rozciągnięcie samej mapy na cały ekran */
                        .v-main, .ol-viewport, #map {
                            padding: 0 !important;
                            margin: 0 !important;
                            width: 100% !important;
                            height: 100% !important;
                        }
                    `;
                    frameDoc.head.appendChild(style);
                } catch (e) {
                    // Ze względów bezpieczeństwa przeglądarki (Cross-Origin) ukrywanie interfejsu działa optymalnie gdy sesja jest natywna
                }
            });
        }
    </script>

</body>
</html>
