<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #traccar {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #error {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        #error h2 {
            margin-top: 20px;
        }

        #error p {
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <iframe
        id="traccar"
        title="Lokalizacja GPS"
        allow="geolocation"
        referrerpolicy="no-referrer">
    </iframe>

    <div id="error">
        <h2>Nie można otworzyć lokalizacji GPS</h2>
        <p id="errorText"></p>
    </div>

    <script>
        /*
         * =====================================================
         * GPS.HTML
         *
         * Adres:
         *
         * https://pzmyslo.github.io/prism-map/gps.html?token=TOKEN
         *
         * zostanie automatycznie zamieniony na:
         *
         * https://demo.traccar.org?token=TOKEN
         * =====================================================
         */

        const TRACCAR_URL = "https://demo.traccar.org/";

        const params = new URLSearchParams(
            window.location.search
        );

        const token = params.get("token");

        const iframe = document.getElementById("traccar");
        const error = document.getElementById("error");
        const errorText = document.getElementById("errorText");


        /*
         * Brak tokena
         */
        if (!token) {

            iframe.style.display = "none";
            error.style.display = "block";

            errorText.textContent =
                "Brak parametru token w adresie strony.";
        }


        /*
         * Token istnieje
         */
        else {

            const traccarUrl =
                TRACCAR_URL +
                "?token=" +
                encodeURIComponent(token);

            iframe.src = traccarUrl;
        }


        /*
         * Jeżeli Traccar zablokuje osadzanie w iframe,
         * pokazujemy informację.
         */
        iframe.addEventListener("load", function () {

            console.log(
                "Traccar załadowany:",
                iframe.src
            );

        });

    </script>

</body>
</html>
