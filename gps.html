<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozycja GPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #error-msg {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            color: #d9534f;
            font-weight: bold;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="error-msg">Brak tokena w adresie URL (?token=...)</div>
    <iframe id="traccar-frame" src=""></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('token');

        if (!TOKEN) {
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('traccar-frame').style.display = 'none';
        } else {
            // Wczytanie widoku Traccara bezpośrednio przez token udostępniania
            const traccarUrl = `https://demo.traccar.org?token=${encodeURIComponent(TOKEN)}`;
            document.getElementById('traccar-frame').src = traccarUrl;
        }
    </script>

</body>
</html>
