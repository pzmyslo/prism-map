<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozycja GPS</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; overflow: hidden; background: #e5e5e5; }
        #status-info {
            position: absolute; top: 12px; right: 12px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 8px 14px; border-radius: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.15); pointer-events: none;
        }
        .error { color: #d9534f !important; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-info">Łączenie...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const REFRESH_INTERVAL = 10000;
        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('token');

        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([52.237, 21.017], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        let positionMarker = null;
        let accuracyCircle = null;
        let initialZoomDone = false;

        async function updatePosition() {
            const statusEl = document.getElementById('status-info');

            if (!TOKEN) {
                statusEl.classList.add('error');
                statusEl.innerText = "Brak tokena w URL (?token=...)";
                return;
            }

            try {
                // Zapytanie JSONP omalujace ograniczenia CORS
                const targetUrl = `https://demo.traccar.org/api/positions?token=${encodeURIComponent(TOKEN)}`;
                const jsonpUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(jsonpUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                
                // Odczyt zawartości zwróconej przez API Traccar
                if (!data.contents) throw new Error("EMPTY_RESPONSE");
                const positions = JSON.parse(data.contents);

                if (Array.isArray(positions) && positions.length > 0) {
                    const latest = positions[positions.length - 1];
                    const latlng = [latest.latitude, latest.longitude];
                    const accuracy = latest.accuracy || 0;

                    if (!positionMarker) {
                        positionMarker = L.circleMarker(latlng, {
                            color: '#ffffff', fillColor: '#0078ff', fillOpacity: 1, weight: 3, radius: 10
                        }).addTo(map);

                        if (accuracy > 0) {
                            accuracyCircle = L.circle(latlng, {
                                radius: accuracy, color: '#0078ff', fillColor: '#0078ff', fillOpacity: 0.15, weight: 1
                            }).addTo(map);
                        }
                    } else {
                        positionMarker.setLatLng(latlng);
                        if (accuracyCircle) {
                            accuracyCircle.setLatLng(latlng);
                            if (accuracy > 0) accuracyCircle.setRadius(accuracy);
                        }
                    }

                    if (!initialZoomDone) {
                        map.setView(latlng, 15);
                        initialZoomDone = true;
                    }

                    statusEl.classList.remove('error');
                    const timeStr = new Date(latest.fixTime || latest.deviceTime).toLocaleTimeString('pl-PL');
                    statusEl.innerText = `Ostatnia pozycja: ${timeStr}`;
                } else {
                    statusEl.innerText = "Brak danych pozycji dla tego tokena";
                }

            } catch (error) {
                console.error("Błąd pobierania:", error);
                statusEl.classList.add('error');
                statusEl.innerText = "Błąd pobierania danych z serwera";
            }
        }

        updatePosition();
        setInterval(updatePosition, REFRESH_INTERVAL);
    </script>
</body>
</html>
