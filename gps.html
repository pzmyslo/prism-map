<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozycja GPS</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        /* Styl dla wskaźnika stanu/błędu */
        #status-info {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 12px;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="status-info">Łączenie z serwerem...</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const TOKEN = "SDBGAiEAo-C7jJOEkmcXJ19kCIJM0MPWlPn23eH8JqpXq5chy-UCIQCU2H2Bpflfdd1zuZ2a8j2pZ36z3xEGKuRqjblmEpd-CXsiaSI6MTUwOTA0NjUyMzU2Mjg4OTQ5NCwidSI6MTM3NDQwLCJlIjoiMjAyNi0wOS0zMFQxNjoyNjowMC4wMDArMDA6MDAifQ";
        const SERVER_URL = "https://demo.traccar.org";
        const REFRESH_INTERVAL = 10000; // Odświeżanie co 10 sekund

        // Inicjalizacja mapy Leaflet (domyślny widok)
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([52.237049, 21.017532], 6);

        // Dodanie darmowych kafli OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        let positionMarker = null;
        let accuracyCircle = null;
        let initialZoomDone = false;

        async function updatePosition() {
            const statusEl = document.getElementById('status-info');
            try {
                // Pobieranie ostatnich pozycji z Traccar za pomocą podanego tokena
                const response = await fetch(`${SERVER_URL}/api/positions?token=${encodeURIComponent(TOKEN)}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }

                const positions = await response.json();

                if (positions && positions.length > 0) {
                    // Pobranie najnowszej pozycji
                    const latest = positions[positions.length - 1];
                    const lat = latest.latitude;
                    const lng = latest.longitude;
                    const accuracy = latest.accuracy || 0;

                    const latlng = [lat, lng];

                    // Tworzenie lub aktualizacja kółka z pozycją
                    if (!positionMarker) {
                        // Kółko punktowe (pozycja)
                        positionMarker = L.circleMarker(latlng, {
                            color: '#ffffff',
                            fillColor: '#0078ff',
                            fillOpacity: 0.9,
                            weight: 2,
                            radius: 9
                        }).addTo(map);

                        // Kółko niedokładności (jeśli dane zawierają czujnik dokładności)
                        if (accuracy > 0) {
                            accuracyCircle = L.circle(latlng, {
                                radius: accuracy,
                                color: '#0078ff',
                                fillColor: '#0078ff',
                                fillOpacity: 0.15,
                                weight: 1
                            }).addTo(map);
                        }
                    } else {
                        positionMarker.setLatLng(latlng);
                        if (accuracyCircle) {
                            accuracyCircle.setLatLng(latlng);
                            if (accuracy > 0) accuracyCircle.setRadius(accuracy);
                        }
                    }

                    // Wyśrodkowanie mapy przy pierwszym załadowaniu danych
                    if (!initialZoomDone) {
                        map.setView(latlng, 15);
                        initialZoomDone = true;
                    }

                    const timeStr = new Date(latest.fixTime || latest.deviceTime).toLocaleTimeString('pl-PL');
                    statusEl.innerText = `Aktualizacja: ${timeStr}`;
                } else {
                    statusEl.innerText = "Brak dostępnych pozycji";
                }

            } catch (error) {
                console.error("Błąd podczas pobierania pozycji:", error);
                statusEl.innerText = "Błąd pobierania danych";
            }
        }

        // Pierwsze wywołanie i cykliczne odświeżanie
        updatePosition();
        setInterval(updatePosition, REFRESH_INTERVAL);
    </script>
</body>
</html>
