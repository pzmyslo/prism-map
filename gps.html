<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Traccar GPS Map</title>


<!-- =====================================================
     LEAFLET
     ===================================================== -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/* =====================================================
   PEŁNY EKRAN I DOMYŚLNE UKRYCIE MAPY
   ===================================================== */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111;

}


/*
 * Mapa jest DOMYŚLNIE UKRYTA (display: none).
 * Pokaże się tylko po odebraniu świeżej pozycji GPS.
 */

#map {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: none;

}


/* =====================================================
   USUWAMY ZOOM
   ===================================================== */

.leaflet-control-zoom {

    display: none !important;

}


/* =====================================================
   ATRYBUCJA OPENSTREETMAP
   ===================================================== */

.leaflet-control-attribution {

    font-size: 7px !important;

    line-height: 9px !important;

    padding: 1px 3px !important;

    background:
        rgba(255,255,255,0.60)
        !important;

}


/* =====================================================
   AKTUALNY PUNKT GPS
   ===================================================== */

.gps-point {

    width: 18px;
    height: 18px;

    box-sizing: border-box;

    border-radius: 50%;

    background: #ff1744;

    border: 3px solid #ffffff;

    box-shadow:

        0 0 0 4px
        rgba(255,23,68,0.30),

        0 2px 7px
        rgba(0,0,0,0.75);

}


/* =====================================================
   STRZAŁKA KIERUNKU
   ===================================================== */

.gps-arrow {

    width: 0;
    height: 0;

    border-left:
        4px solid transparent;

    border-right:
        4px solid transparent;

    border-bottom:
        14px solid yellow;

    filter:
        drop-shadow(
            0 2px 2px rgba(0,0,0,0.75)
        );

}


/* =====================================================
   STATUS BŁĘDU / OFFLINE
   ===================================================== */

#status {

    position: absolute;

    left: 5px;
    top: 5px;

    z-index: 10000;

    padding:
        4px 7px;

    border-radius: 5px;

    background:
        rgba(0,0,0,0.78);

    color: white;

    font:
        10px Arial,
        sans-serif;

    display: none;

}

</style>

</head>


<body>


<div id="map"></div>

<div id="status"></div>


<script>

/* =====================================================
   KONFIGURACJA
   ===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const TOKEN =
    params.get("token");


const SERVER =
    "https://demo.traccar.org";


const REFRESH_TIME =
    1000;


/* 
 * Czas w ms (15 sekund). Jeśli ostatnia pozycja jest starsza,
 * urządzenie uznajemy za wyłączone i ukrywamy mapę.
 */
const MAX_POSITION_AGE =
    15000;


const MAP_ZOOM =
    16;


/* =====================================================
   MAPA LEAFLET
   ===================================================== */

const map =
    L.map(
        "map",
        {

            zoomControl:
                false,

            attributionControl:
                true,

            dragging:
                false,

            scrollWheelZoom:
                false,

            doubleClickZoom:
                false,

            touchZoom:
                false,

            boxZoom:
                false,

            keyboard:
                false

        }
    );


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:
            19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(map);


/* =====================================================
   IKONY
   ===================================================== */

const gpsPointIcon =
    L.divIcon({

        className:
            "",

        html:
            '<div class="gps-point"></div>',

        iconSize:
            [18,18],

        iconAnchor:
            [9,9]

    });


const gpsArrowIcon =
    L.divIcon({

        className:
            "",

        html:
            '<div id="directionArrow" class="gps-arrow"></div>',

        iconSize:
            [8,14],

        iconAnchor:
            [4,7]

    });


/* =====================================================
   ZMIENNE
   ===================================================== */

let gpsMarker =
    null;


let directionMarker =
    null;


let firstPosition =
    true;


/* =====================================================
   KONTROLA WIDOCZNOŚCI MAPY I STATUSU
   ===================================================== */

function showStatus(
    text
) {

    const element =
        document.getElementById(
            "status"
        );


    element.textContent =
        text;


    element.style.display =
        text
            ? "block"
            : "none";

}


function setMapVisible(
    visible
) {

    const mapElement =
        document.getElementById(
            "map"
        );


    const isHidden =
        mapElement.style.display === "none" ||
        mapElement.style.display === "";


    if (
        visible
    ) {

        mapElement.style.display =
            "block";


        /* 
         * Wymusza przeliczenie rozmiaru mapy po zmianie z display:none na display:block
         */
        if (
            isHidden
        ) {

            setTimeout(
                function () {

                    map.invalidateSize();

                },
                50
            );

        }

    }
    else {

        mapElement.style.display =
            "none";

    }

}


/* =====================================================
   POBIERANIE AKTUALNEGO GPS Z TRACCAR
   ===================================================== */

async function updateGPS() {

    try {

        const response =
            await fetch(

                SERVER +
                "/api/positions",

                {

                    method:
                        "GET",

                    cache:
                        "no-store",

                    headers:
                        {

                            "Accept":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                TOKEN

                        }

                }

            );


        if (
            !response.ok
        ) {

            showStatus(
                "GPS HTTP " +
                response.status
            );

            setMapVisible(false);

            return;

        }


        const positions =
            await response.json();


        if (
            !Array.isArray(
                positions
            )
            ||
            positions.length === 0
        ) {

            showStatus(
                "BRAK POZYCJI"
            );

            setMapVisible(false);

            return;

        }


        const data =
            positions[0];


        /* =============================================
           WERYFIKACJA WIEKU SYGNAŁU (KLIENT WYŁĄCZONY?)
           ============================================= */

        const rawTime =
            data.fixTime ||
            data.serverTime ||
            data.deviceTime;


        const fixTimestamp =
            new Date(rawTime).getTime();


        const now =
            Date.now();


        const age =
            now - fixTimestamp;


        /* 
         * Jeśli brak prawidłowego czasu lub sygnał jest starszy niż 15 sek.
         * -> Ukrywamy mapę i wyświetlamy informację.
         */
        if (
            isNaN(fixTimestamp)
            ||
            age > MAX_POSITION_AGE
            ||
            age < -MAX_POSITION_AGE
        ) {

            showStatus(
                "GPS WYŁĄCZONY"
            );

            setMapVisible(false);

            return;

        }


        const latitude =
            Number(
                data.latitude
            );


        const longitude =
            Number(
                data.longitude
            );


        if (
            !Number.isFinite(
                latitude
            )
            ||
            !Number.isFinite(
                longitude
            )
        ) {

            showStatus(
                "BŁĘDNA POZYCJA"
            );

            setMapVisible(false);

            return;

        }


        /* =============================================
           SYGNAŁ AKTUALNY -> POKAZUJEMY MAPĘ
           ============================================= */

        setMapVisible(true);


        const position =
            [
                latitude,
                longitude
            ];


        /* =============================================
           PUNKT GPS
           ============================================= */

        if (
            !gpsMarker
        ) {

            gpsMarker =
                L.marker(

                    position,

                    {

                        icon:
                            gpsPointIcon,

                        interactive:
                            false

                    }

                ).addTo(map);

        }
        else {

            gpsMarker.setLatLng(
                position
            );

        }


        /* =============================================
           KIERUNEK JAZDY
           ============================================= */

        const course =
            Number(
                data.course
            );


        if (
            Number.isFinite(
                course
            )
        ) {

            if (
                !directionMarker
            ) {

                directionMarker =
                    L.marker(

                        position,

                        {

                            icon:
                                gpsArrowIcon,

                            interactive:
                                false

                        }

                    ).addTo(map);

            }
            else {

                directionMarker.setLatLng(
                    position
                );

            }


            const arrow =
                document.getElementById(
                    "directionArrow"
                );


            if (
                arrow
            ) {

                arrow.style.transform =
                    "rotate(" +
                    course +
                    "deg)";

            }

        }


        /* =============================================
           CENTROWANIE MAPY
           ============================================= */

        if (
            firstPosition
        ) {

            map.setView(

                position,

                MAP_ZOOM,

                {

                    animate:
                        false

                }

            );


            firstPosition =
                false;

        }
        else {

            map.panTo(

                position,

                {

                    animate:
                        false

                }

            );

        }


        showStatus("");

    }
    catch (
        error
    ) {

        showStatus(
            "BŁĄD POŁĄCZENIA"
        );

        setMapVisible(false);

    }

}


/* =====================================================
   START
   ===================================================== */

function start() {

    if (
        !TOKEN
    ) {

        showStatus(
            "BRAK TOKENU"
        );

        setMapVisible(false);

        return;

    }


    updateGPS();


    setInterval(

        updateGPS,

        REFRESH_TIME

    );

}


/* =====================================================
   URUCHOMIENIE
   ===================================================== */

start();

</script>

</body>

</html>
