<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Traccar GPS Map</title>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body, #map {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
}

#map {
    position: absolute;
    left: 0;
    top: 0;
}

.leaflet-control-zoom {
    display: none !important;
}

.leaflet-control-attribution {
    font-size: 7px !important;
    line-height: 9px !important;
    padding: 1px 3px !important;
    background: rgba(255,255,255,0.60) !important;
}

.gps-point {
    width: 18px;
    height: 18px;
    box-sizing: border-box;
    border-radius: 50%;
    background: #ff1744;
    border: 3px solid #ffffff;
    box-shadow: 0 0 0 4px rgba(255,23,68,0.30), 0 2px 7px rgba(0,0,0,0.75);
}

.gps-arrow {
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 28px solid #ff1744;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.75));
}

#status {
    position: absolute;
    left: 5px;
    top: 5px;
    z-index: 10000;
    padding: 4px 7px;
    border-radius: 5px;
    background: rgba(0,0,0,0.78);
    color: white;
    font: 10px Arial, sans-serif;
    display: none;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="status"></div>

<script>
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get("token");
const SERVER = "https://demo4.traccar.org";
const REFRESH_TIME = 2000;
const MAP_RADIUS_METERS = 100;

const map = L.map("map", {
    zoomControl: false,
    attributionControl: true,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    touchZoom: false,
    boxZoom: false,
    keyboard: false
});

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const gpsPointIcon = L.divIcon({
    className: "",
    html: '<div class="gps-point"></div>',
    iconSize: [18,18],
    iconAnchor: [9,9]
});

const gpsArrowIcon = L.divIcon({
    className: "",
    html: '<div id="directionArrow" class="gps-arrow"></div>',
    iconSize: [16,28],
    iconAnchor: [8,14]
});

let gpsMarker = null;
let directionMarker = null;
let firstPosition = true;

function showStatus(text) {
    const element = document.getElementById("status");
    element.textContent = text;
    element.style.display = text ? "block" : "none";
}

function centerMapAroundGPS(position) {
    const center = L.latLng(position[0], position[1]);
    const north = center.toBounds(MAP_RADIUS_METERS * 2);
    map.fitBounds(north, {
        padding: [10, 10],
        animate: false,
        maxZoom: 18
    });
}

async function updateGPS() {
    try {
        if (!TOKEN) {
            showStatus("BRAK TOKENU W URL");
            return;
        }

        // Token przekazywany bezpośrednio w zapytaniu URL do Traccara
        const targetUrl = SERVER + "/api/positions?token=" + encodeURIComponent(TOKEN);
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

        const response = await fetch(proxyUrl, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            showStatus("GPS HTTP " + response.status);
            console.error("Traccar HTTP error:", response.status);
            return;
        }

        const positions = await response.json();

        if (!Array.isArray(positions) || positions.length === 0) {
            showStatus("BRAK POZYCJI");
            return;
        }

        const data = positions[0];
        const latitude = Number(data.latitude);
        const longitude = Number(data.longitude);

        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
            showStatus("BŁĘDNA POZYCJA");
            return;
        }

        const position = [latitude, longitude];

        if (!gpsMarker) {
            gpsMarker = L.marker(position, {
                icon: gpsPointIcon,
                interactive: false
            }).addTo(map);
        } else {
            gpsMarker.setLatLng(position);
        }

        const course = Number(data.course);

        if (Number.isFinite(course)) {
            if (!directionMarker) {
                directionMarker = L.marker(position, {
                    icon: gpsArrowIcon,
                    interactive: false
                }).addTo(map);
            } else {
                directionMarker.setLatLng(position);
            }

            const arrow = document.getElementById("directionArrow");
            if (arrow) {
                arrow.style.transform = "rotate(" + course + "deg)";
            }
        }

        if (firstPosition) {
            centerMapAroundGPS(position);
            firstPosition = false;
        } else {
            map.panTo(position, { animate: false });
        }

        showStatus("");

    } catch (error) {
        console.error("BŁĄD GPS:", error);
        const message = error && error.message ? error.message : String(error);
        showStatus("BŁĄD GPS: " + message);
    }
}

function start() {
    if (!TOKEN) {
        showStatus("BRAK TOKENU W URL");
        return;
    }

    updateGPS();
    setInterval(updateGPS, REFRESH_TIME);
}

start();
</script>
</body>
</html>
