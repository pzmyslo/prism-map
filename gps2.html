<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPS</title>


    <!-- =========================================
         LEAFLET
         ========================================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        /* =========================================
           CAŁA STRONA
           ========================================= */

        html,
        body,
        #map {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            overflow: hidden;

            background: #000;

        }


        #map {

            position: fixed;

            inset: 0;

        }


        /* =========================================
           MAŁY PUNKT GPS
           ========================================= */

        .gps-marker {

            width: 14px;
            height: 14px;

            background: #1976d2;

            border: 2px solid #fff;

            border-radius: 50%;

            box-shadow:
                0 1px 5px
                rgba(0, 0, 0, 0.5);

        }


        /* =========================================
           CZARNA PLANSZA
           ========================================= */

        #awayScreen {

            display: none;

            position: fixed;

            z-index: 10000;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;

            color: #fff;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size:
                clamp(32px, 8vw, 90px);

            font-weight: 500;

            letter-spacing: 1px;

        }


        #awayScreen.visible {

            display: flex;

        }


        /* =========================================
           KOMUNIKAT BŁĘDU
           ========================================= */

        #error {

            display: none;

            position: fixed;

            z-index: 11000;

            left: 50%;

            top: 20px;

            transform:
                translateX(-50%);

            width:
                min(90%, 500px);

            padding:
                12px 16px;

            background:
                rgba(180, 0, 0, 0.95);

            color: #fff;

            border-radius: 8px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            text-align: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.3);

        }


        /* =========================================
           ATRYBUCJA OPENSTREETMAP
           ========================================= */

        .leaflet-control-attribution {

            font-size: 9px !important;

            opacity: 0.8;

        }

    </style>

</head>


<body>


    <!-- =========================================
         MAPA
         ========================================= -->

    <div id="map"></div>


    <!-- =========================================
         CZARNA PLANSZA
         ========================================= -->

    <div id="awayScreen">

        Zaraz wracam

    </div>


    <!-- =========================================
         KOMUNIKAT BŁĘDU
         ========================================= -->

    <div id="error"></div>


    <!-- =========================================
         LEAFLET JS
         ========================================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>


        /* =====================================================
           CLOUDFLARE WORKER
           ===================================================== */

        const WORKER_URL =
            "https://prism-gps.piozmy1.workers.dev";


        /* =====================================================
           CZĘSTOTLIWOŚĆ POBIERANIA GPS
           ===================================================== */

        const UPDATE_INTERVAL =
            10000;


        /* =====================================================
           CZAS BEZ ZMIANY POZYCJI
           
           10 minut = 600 000 ms
           ===================================================== */

        const NO_MOVEMENT_TIME =
            10 * 60 * 1000;


        /* =====================================================
           POBRANIE TOKENU Z ADRESU

           Przykład:

           gps.html?token=ABC123
           ===================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");


        /* =====================================================
           UTWORZENIE MAPY

           zoomControl: false
           usuwa przyciski + i -
           ===================================================== */

        const map =
            L.map(

                "map",

                {

                    zoomControl: false

                }

            );


        /* =====================================================
           OPENSTREETMAP
           ===================================================== */

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 19,

                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'

            }

        ).addTo(map);


        /* =====================================================
           WIDOK POCZĄTKOWY

           Po otrzymaniu GPS zostanie automatycznie
           ustawiony na aktualnej pozycji.
           ===================================================== */

        map.setView(

            [52.069, 19.480],

            6

        );


        /* =====================================================
           IKONA GPS
           ===================================================== */

        const gpsIcon =
            L.divIcon({

                className: "",

                html:
                    '<div class="gps-marker"></div>',

                iconSize:
                    [18, 18],

                iconAnchor:
                    [9, 9]

            });


        /* =====================================================
           ZMIENNE
           ===================================================== */

        let marker = null;


        let firstPosition = true;


        /*
         * Ostatnia znana szerokość geograficzna
         */

        let lastLatitude = null;


        /*
         * Ostatnia znana długość geograficzna
         */

        let lastLongitude = null;


        /*
         * Moment ostatniej rzeczywistej zmiany pozycji
         */

        let lastPositionChangeTime = null;


        /*
         * Czy aktualnie wyświetlamy
         * czarną planszę?
         */

        let awayMode = false;


        /* =====================================================
           ELEMENTY HTML
           ===================================================== */

        const awayScreen =
            document.getElementById(
                "awayScreen"
            );


        const errorElement =
            document.getElementById(
                "error"
            );


        /* =====================================================
           POKAŻ "ZARAZ WRACAM"
           ===================================================== */

        function showAwayScreen() {

            if (awayMode) {

                return;

            }


            awayMode = true;


            awayScreen.classList.add(
                "visible"
            );

        }


        /* =====================================================
           UKRYJ "ZARAZ WRACAM"
           ===================================================== */

        function hideAwayScreen() {

            if (!awayMode) {

                return;

            }


            awayMode = false;


            awayScreen.classList.remove(
                "visible"
            );

        }


        /* =====================================================
           POKAŻ BŁĄD
           ===================================================== */

        function showError(message) {

            errorElement.textContent =
                message;

            errorElement.style.display =
                "block";

        }


        /* =====================================================
           UKRYJ BŁĄD
           ===================================================== */

        function hideError() {

            errorElement.style.display =
                "none";

        }


        /* =====================================================
           SPRAWDZENIE 10 MINUT
           ===================================================== */

        function checkPositionTimeout() {


            /*
             * Jeżeli nie mamy jeszcze
             * żadnej pozycji, nic nie robimy.
             */

            if (
                lastPositionChangeTime === null
            ) {

                return;

            }


            /*
             * Ile czasu minęło
             * od ostatniej zmiany pozycji?
             */

            const elapsed =
                Date.now() -
                lastPositionChangeTime;


            /*
             * 10 minut bez zmiany
             */

            if (
                elapsed >=
                NO_MOVEMENT_TIME
            ) {

                showAwayScreen();

            }

        }


        /* =====================================================
           POBIERANIE POZYCJI GPS
           ===================================================== */

        async function updateGPS() {

            try {


                /* ---------------------------------------------
                   SPRAWDZENIE TOKENU
                   --------------------------------------------- */

                if (!token) {

                    throw new Error(
                        "Brak tokenu w adresie."
                    );

                }


                /* ---------------------------------------------
                   POBRANIE DANYCH Z WORKERA
                   --------------------------------------------- */

                const response =
                    await fetch(

                        WORKER_URL +
                        "?token=" +
                        encodeURIComponent(
                            token
                        ),

                        {

                            method: "GET",

                            cache: "no-store"

                        }

                    );


                /* ---------------------------------------------
                   SPRAWDZENIE ODPOWIEDZI
                   --------------------------------------------- */

                if (!response.ok) {

                    throw new Error(

                        "HTTP " +
                        response.status

                    );

                }


                /* ---------------------------------------------
                   ODCZYT JSON
                   --------------------------------------------- */

                const positions =
                    await response.json();


                /* ---------------------------------------------
                   BRAK POZYCJI
                   --------------------------------------------- */

                if (

                    !Array.isArray(
                        positions
                    )

                    ||

                    positions.length === 0

                ) {

                    throw new Error(
                        "Brak dostępnej pozycji GPS."
                    );

                }


                /* ---------------------------------------------
                   NAJNOWSZA POZYCJA
                   --------------------------------------------- */

                const position =
                    positions[0];


                /* ---------------------------------------------
                   WSPÓŁRZĘDNE
                   --------------------------------------------- */

                const latitude =
                    Number(
                        position.latitude
                    );


                const longitude =
                    Number(
                        position.longitude
                    );


                /* ---------------------------------------------
                   SPRAWDZENIE WSPÓŁRZĘDNYCH
                   --------------------------------------------- */

                if (

                    !Number.isFinite(
                        latitude
                    )

                    ||

                    !Number.isFinite(
                        longitude
                    )

                ) {

                    throw new Error(
                        "Nieprawidłowe współrzędne GPS."
                    );

                }


                /* =================================================
                   SPRAWDZENIE CZY POZYCJA SIĘ ZMIENIŁA
                   ================================================= */

                const positionChanged =

                    lastLatitude === null

                    ||

                    lastLongitude === null

                    ||

                    latitude !==
                        lastLatitude

                    ||

                    longitude !==
                        lastLongitude;


                /* ---------------------------------------------
                   POZYCJA SIĘ ZMIENIŁA
                   --------------------------------------------- */

                if (positionChanged) {


                    /*
                     * Zapamiętujemy nową pozycję.
                     */

                    lastLatitude =
                        latitude;


                    lastLongitude =
                        longitude;


                    /*
                     * Zerujemy licznik 10 minut.
                     */

                    lastPositionChangeTime =
                        Date.now();


                    /*
                     * Jeżeli wcześniej była czarna
                     * plansza, pokazujemy mapę.
                     */

                    hideAwayScreen();

                }


                /* ---------------------------------------------
                   WSPÓŁRZĘDNE DLA LEAFLET
                   --------------------------------------------- */

                const coordinates = [

                    latitude,
                    longitude

                ];


                /* =================================================
                   MARKER GPS
                   ================================================= */

                if (!marker) {


                    /*
                     * Pierwsze utworzenie punktu.
                     */

                    marker =
                        L.marker(

                            coordinates,

                            {

                                icon:
                                    gpsIcon

                            }

                        ).addTo(map);

                }

                else {


                    /*
                     * Aktualizacja pozycji punktu.
                     */

                    marker.setLatLng(
                        coordinates
                    );

                }


                /* =================================================
                   PIERWSZE CENTROWANIE MAPY
                   ================================================= */

                map.setView(
    coordinates,
    17,
    {
        animate: true,
        duration: 1
    }
);

firstPosition = false;

                /* ---------------------------------------------
                   USUNIĘCIE BŁĘDU
                   --------------------------------------------- */

                hideError();


                /* ---------------------------------------------
                   LOG W KONSOLI
                   --------------------------------------------- */

                console.log(

                    "GPS:",

                    latitude,

                    longitude,

                    position.fixTime

                );

            }


            catch (error) {


                console.error(

                    "GPS ERROR:",

                    error

                );


                showError(

                    "Nie można pobrać lokalizacji: " +
                    error.message

                );

            }

        }


        /* =====================================================
           PIERWSZE POBRANIE GPS
           ===================================================== */

        updateGPS();


        /* =====================================================
           AUTOMATYCZNE ODŚWIEŻANIE GPS

           Co 10 sekund.
           ===================================================== */

        setInterval(

            updateGPS,

            UPDATE_INTERVAL

        );


        /* =====================================================
           SPRAWDZANIE 10-MINUTOWEGO BRAKU RUCHU

           Sprawdzamy co sekundę.
           ===================================================== */

        setInterval(

            checkPositionTimeout,

            1000

        );


    </script>


</body>

</html>
